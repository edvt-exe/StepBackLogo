<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StepBackLogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>StepBackLogo</h1>
        </header>

        <main>
            <div class="image-wrapper">
                <img id="logo-img" src="" alt="Guess the logo">
            </div>

            <div class="indicators" id="indicators">
            </div>

            <div class="input-section" id="input-section">
                <input type="text" id="guess-input" placeholder="Enter brand name..." autocomplete="off">
                <button id="guess-btn">Guess</button>
            </div>

            <div class="result-section hidden" id="result-section">
                <h2 id="result-message"></h2>
                <p id="correct-answer" class="hidden"></p>
                <button id="share-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    Share
                </button>
            </div>
        </main>
    </div>

    <div id="toast" class="toast hidden">Copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
